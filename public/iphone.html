<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>会員スキャナー</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, sans-serif; }
    body { margin: 0; padding: 0; background: #0f172a; color: #fff; text-align: center; overflow: hidden; }
    
    .container { display: flex; flex-direction: column; height: 100vh; justify-content: space-between; padding: 20px 15px; }
    header h1 { font-size: 20px; margin: 0; color: #38bdf8; }
    header p { font-size: 13px; color: #94a3b8; margin-top: 5px; }

    .scanner-container {
      position: relative;
      width: 100%;
      max-width: 360px;
      height: 320px;
      margin: 0 auto;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      border: 2px solid #334155;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    .scan-guide {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 200px; height: 200px;
      border: 3px solid #38bdf8;
      border-radius: 12px;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }

    .result-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 15px;
      margin-top: 10px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .status-tag {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      background: #334155;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .status-tag.active { background: #0284c7; color: #fff; }

    .result-text { font-size: 16px; font-weight: bold; margin: 8px 0; }
    
    .reset-btn {
      margin-top: 10px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .reset-btn:active { background: #0369a1; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>会員QRスキャナー</h1>
      <p>レジへ連携する会員QRコードをかざしてください</p>
    </header>

    <div class="scanner-container">
      <video id="video" playsinline></video>
      <canvas id="canvas" hidden></canvas>
      <div class="scan-guide"></div>
    </div>

    <div class="result-card">
      <div id="statusTag" class="status-tag">読み取り待機中</div>
      <div id="resultText" class="result-text">カメラにQRコードをかざしてください</div>
      <button id="nextScanBtn" class="reset-btn" style="display:none;" onclick="resetToWaitState()">次のQRコードを読み取る</button>
    </div>
  </div>

  <script>
    const socket = io();
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusTag = document.getElementById('statusTag');
    const resultText = document.getElementById('resultText');
    const nextScanBtn = document.getElementById('nextScanBtn');

    let isScanning = true;

    // 背面カメラ起動
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } }
        });
        video.srcObject = stream;
        video.setAttribute('playsinline', true);
        video.play();
        requestAnimationFrame(tick);
      } catch (err) {
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" }
          });
          video.srcObject = fallbackStream;
          video.setAttribute('playsinline', true);
          video.play();
          requestAnimationFrame(tick);
        } catch (e) {
          resultText.innerText = "カメラの起動に失敗しました";
        }
      }
    }

    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA && isScanning) {
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: "dontInvert",
        });

        // 読み取り成功時の処理（isScanningで即座にロック）
        if (code && code.data) {
          onCodeScanned(code.data);
        }
      }
      requestAnimationFrame(tick);
    }

    function triggerVibration() {
      if ("vibrate" in navigator) {
        navigator.vibrate([100, 50, 100]);
      }
    }

    function onCodeScanned(scannedData) {
      // 連打・ループ防止：最初にフラグを折る
      isScanning = false;

      const trimmedData = scannedData.trim();
      statusTag.innerText = "送信中";
      statusTag.classList.add('active');
      resultText.innerText = `コード読み取り: ${trimmedData}`;

      // サーバーへ送信
      socket.emit('scan-qr', { code: trimmedData });

      triggerVibration();
      nextScanBtn.style.display = "inline-block";
    }

    // サーバーからのエラー応答（未登録会員・ロック中など）
    socket.on('error-message', (data) => {
      statusTag.innerText = "エラー";
      statusTag.classList.remove('active');
      resultText.innerText = data.message || "エラーが発生しました";
    });

    // 会員読み取り完了の通知（名前ではなくIDを表示）
    socket.on('member-scanned', (data) => {
      statusTag.innerText = "連携完了";
      statusTag.classList.add('active');
      resultText.innerText = `ID: ${data.member.id} を連携しました`;
    });

    // 待機状態に戻す
    function resetToWaitState() {
      statusTag.innerText = "読み取り待機中";
      statusTag.classList.remove('active');
      resultText.innerText = "カメラにQRコードをかざしてください";
      nextScanBtn.style.display = "none";
      isScanning = true; // スキャン再開
    }

    window.addEventListener('load', startCamera);
  </script>
</body>
</html>
