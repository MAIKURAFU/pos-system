<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>読取機</title>
  <script src="/socket.io/socket.io.js"></script>
  <!-- JANコード・1Dバーコード・QRコード対応ライブラリ ZXing -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, sans-serif; }
    body { margin: 0; padding: 0; background: #0f172a; color: #fff; text-align: center; overflow: hidden; }
    
    .container { display: flex; flex-direction: column; height: 100vh; justify-content: space-between; padding: 15px; }
    
    /* タブ切り替えUI */
    .tab-container {
      display: flex;
      background: #1e293b;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 10px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #38bdf8;
      color: #0f172a;
    }

    .scanner-container {
      position: relative;
      width: 100%;
      max-width: 360px;
      height: 280px;
      margin: 0 auto;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      border: 2px solid #334155;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    /* スキャンガイド（モードに応じて縦横比変更） */
    .scan-guide {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 200px; height: 200px;
      border: 3px solid #38bdf8;
      border-radius: 12px;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      transition: all 0.3s ease;
    }
    /* 在庫補充時の横長ガイド */
    .scan-guide.barcode-mode {
      width: 260px;
      height: 120px;
    }

    .restock-controls {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .restock-controls label { font-size: 14px; color: #94a3b8; }
    .restock-controls input {
      width: 80px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      text-align: center;
    }

    .result-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 15px;
      margin-top: 10px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .status-tag {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      background: #334155;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .status-tag.active { background: #0284c7; color: #fff; }
    .status-tag.success { background: #10b981; color: #fff; }
    .status-tag.checkout { background: #f59e0b; color: #fff; }
    .status-tag.error { background: #ef4444; color: #fff; }

    .result-text { font-size: 15px; font-weight: bold; margin: 6px 0; word-break: break-all; }
    
    .reset-btn {
      margin-top: 6px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .reset-btn:active { background: #0369a1; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <!-- タブ切り替えボタン -->
      <div class="tab-container">
        <button id="tabMember" class="tab-btn active" onclick="switchMode('member')">会員スキャン (QR)</button>
        <button id="tabRestock" class="tab-btn" onclick="switchMode('restock')">在庫補充 (JAN)</button>
      </div>
    </header>

    <div class="scanner-container">
      <video id="video" playsinline></video>
      <div id="scanGuide" class="scan-guide"></div>
    </div>

    <!-- 在庫補充用：一度に補充する個数の設定 -->
    <div id="restockInputArea" class="restock-controls" style="display: none;">
      <label for="restockAmount">補充数量:</label>
      <input type="number" id="restockAmount" value="1" min="1" max="999">
    </div>

    <div class="result-card">
      <div id="statusTag" class="status-tag">読み取り待機中</div>
      <div id="resultText" class="result-text">カメラにコードをかざしてください</div>
      <button id="nextScanBtn" class="reset-btn" style="display:none;" onclick="resetToWaitState()">次のコードを読み取る</button>
    </div>
  </div>

  <script>
    const socket = io();
    const video = document.getElementById('video');
    const statusTag = document.getElementById('statusTag');
    const resultText = document.getElementById('resultText');
    const nextScanBtn = document.getElementById('nextScanBtn');
    const restockInputArea = document.getElementById('restockInputArea');
    const scanGuide = document.getElementById('scanGuide');

    let codeReader = null;
    let isScanning = true;
    let currentMode = 'member';
    let autoResetTimer = null;
    let scanInterval = null;
    let isProcessingFrame = false;

    // --- 各会員の入退場状態を保持するマップ ---
    const memberStateMap = new Map();

    // --- 誤読防止用バッファ変数 ---
    let lastCandidateCode = "";
    let candidateCount = 0;
    const REQUIRED_MATCH_COUNT = 2;

    // JANコードのチェックデジット検証 (モジュラス10)
    function isValidJanCheckDigit(janStr) {
      if (!/^\d{8}$|^\d{13}$/.test(janStr)) return false;
      const digits = janStr.split('').map(Number);
      const checkDigit = digits.pop();
      let sum = 0;

      if (janStr.length === 13) {
        for (let i = 0; i < digits.length; i++) {
          sum += (i % 2 === 1) ? digits[i] * 3 : digits[i];
        }
      } else {
        for (let i = 0; i < digits.length; i++) {
          sum += (i % 2 === 0) ? digits[i] * 3 : digits[i];
        }
      }

      const calculatedCheckDigit = (10 - (sum % 10)) % 10;
      return calculatedCheckDigit === checkDigit;
    }

    // Web Audio API によるスキャン音の再生（iOS対応）
    let audioCtx = null;
    function initAudio() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        console.error("Audio init error", e);
      }
    }

    function playBeepSound(type = 'success') {
      try {
        initAudio();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sine';
        
        if (type === 'success') {
          osc.frequency.setValueAtTime(1800, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.1);
        } else {
          osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.08);

          setTimeout(() => {
            if (!audioCtx) return;
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(1800, audioCtx.currentTime);
            gain2.gain.setValueAtTime(0.15, audioCtx.currentTime);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start();
            osc2.stop(audioCtx.currentTime + 0.1);
          }, 90);
        }
      } catch (e) {
        console.error("Audio play error", e);
      }

      if ("vibrate" in navigator) {
        navigator.vibrate(100);
      }
    }

    document.addEventListener('touchstart', initAudio, { once: true });
    document.addEventListener('click', initAudio, { once: true });

    // モード切り替え処理
    function switchMode(mode) {
      if (currentMode === mode && codeReader) return;
      currentMode = mode;
      
      document.getElementById('tabMember').classList.toggle('active', mode === 'member');
      document.getElementById('tabRestock').classList.toggle('active', mode === 'restock');
      
      restockInputArea.style.display = (mode === 'restock') ? 'flex' : 'none';
      
      if (mode === 'restock') {
        scanGuide.classList.add('barcode-mode');
      } else {
        scanGuide.classList.remove('barcode-mode');
      }

      resetToWaitState();
      startScanner();
    }

    // スキャナーおよびカメラの停止処理
    function stopScanner() {
      if (scanInterval) {
        clearInterval(scanInterval);
        scanInterval = null;
      }
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
        video.srcObject = null;
      }
      if (codeReader) {
        codeReader.reset();
      }
    }

    // ZXing スキャナーの開始（青枠内限定スキャン）
    async function startScanner() {
      stopScanner();

      const hints = new Map();
      let formats = [];
      if (currentMode === 'member') {
        formats = [ZXing.BarcodeFormat.QR_CODE];
      } else {
        formats = [
          ZXing.BarcodeFormat.EAN_13,
          ZXing.BarcodeFormat.EAN_8
        ];
      }
      
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

      codeReader = new ZXing.BrowserMultiFormatReader(hints);

      try {
        const videoInputDevices = await codeReader.listVideoInputDevices();
        let selectedDeviceId = undefined;
        const backCamera = videoInputDevices.find(device => 
          device.label.toLowerCase().includes('back') || 
          device.label.toLowerCase().includes('背面') ||
          device.label.toLowerCase().includes('environment')
        );
        
        if (backCamera) {
          selectedDeviceId = backCamera.deviceId;
        } else if (videoInputDevices.length > 0) {
          selectedDeviceId = videoInputDevices[videoInputDevices.length - 1].deviceId;
        }

        const constraints = {
          video: {
            deviceId: selectedDeviceId ? { exact: selectedDeviceId } : undefined,
            facingMode: 'environment'
          }
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        await video.play();

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        // 定期的に青枠部分の映像だけを切り出してデコード実行
        scanInterval = setInterval(async () => {
          if (!isScanning || isProcessingFrame) return;
          if (video.readyState !== video.HAVE_ENOUGH_DATA && video.readyState !== video.HAVE_FUTURE_DATA) return;

          isProcessingFrame = true;
          try {
            const videoRect = video.getBoundingClientRect();
            const guideRect = scanGuide.getBoundingClientRect();

            if (videoRect.width === 0 || videoRect.height === 0) {
              isProcessingFrame = false;
              return;
            }

            const scaleX = video.videoWidth / videoRect.width;
            const scaleY = video.videoHeight / videoRect.height;

            const sx = Math.max(0, (guideRect.left - videoRect.left) * scaleX);
            const sy = Math.max(0, (guideRect.top - videoRect.top) * scaleY);
            const sWidth = Math.min(video.videoWidth - sx, guideRect.width * scaleX);
            const sHeight = Math.min(video.videoHeight - sy, guideRect.height * scaleY);

            if (sWidth <= 0 || sHeight <= 0) {
              isProcessingFrame = false;
              return;
            }

            canvas.width = sWidth;
            canvas.height = sHeight;
            ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, sWidth, sHeight);

            const result = await codeReader.decodeFromImageElement(canvas);
            if (result && isScanning) {
              onCodeScanned(result.getText());
            }
          } catch (e) {
            // 検出されない場合は例外が発生するため無視
          } finally {
            isProcessingFrame = false;
          }
        }, 150);

      } catch (err) {
        console.error("Camera start error:", err);
        statusTag.innerText = "エラー";
        statusTag.className = "status-tag error";
        resultText.innerText = "カメラの起動に失敗しました（アクセス許可を確認してください）";
      }
    }

    function onCodeScanned(scannedData) {
      if (!isScanning) return;

      const trimmedData = scannedData.trim();

      if (currentMode === 'restock') {
        if (!isValidJanCheckDigit(trimmedData)) {
          candidateCount = 0;
          lastCandidateCode = "";
          return;
        }
      }

      if (trimmedData === lastCandidateCode) {
        candidateCount++;
      } else {
        lastCandidateCode = trimmedData;
        candidateCount = 1;
      }

      if (candidateCount < REQUIRED_MATCH_COUNT) {
        return;
      }

      isScanning = false;
      candidateCount = 0;
      lastCandidateCode = "";

      if (autoResetTimer) clearTimeout(autoResetTimer);

      statusTag.innerText = "処理中";
      statusTag.className = "status-tag active";

      if (currentMode === 'member') {
        const currentState = memberStateMap.get(trimmedData) || 'exited';
        const isEntering = (currentState === 'exited');
        const actionType = isEntering ? 'check-in' : 'check-out';
        
        memberStateMap.set(trimmedData, isEntering ? 'entered' : 'exited');

        playBeepSound('success');
        resultText.innerText = `読み取りコード: ${trimmedData} (${isEntering ? '入場' : '退場'})`;
        
        socket.emit('scan-qr', { 
          code: trimmedData,
          action: actionType
        });
      } else if (currentMode === 'restock') {
        playBeepSound('restock');
        const amountInput = document.getElementById('restockAmount');
        const amount = parseInt(amountInput.value, 10) || 1;
        
        socket.emit('restock-item', { 
          productId: trimmedData, 
          amount: amount 
        });
        
        statusTag.innerText = "補充完了";
        statusTag.className = "status-tag success";
        resultText.innerText = `JAN [${trimmedData}] を ${amount}個 補充しました`;

        autoResetTimer = setTimeout(() => {
          resetToWaitState();
        }, 1800);
      }

      nextScanBtn.style.display = "inline-block";
    }

    socket.on('error-message', (data) => {
      statusTag.innerText = "エラー";
      statusTag.className = "status-tag error";
      resultText.innerText = (data && data.message) ? data.message : "エラーが発生しました";
    });

    socket.on('member-scanned', (data) => {
      statusTag.innerText = "読取完了";
      statusTag.className = "status-tag success";

      const memberObj = data ? (data.member || data) : {};
      const memberId = memberObj.id || memberObj.memberId || memberObj.code || '不明';

      resultText.innerText = `会員ID: ${memberId} を読み取りました`;

      autoResetTimer = setTimeout(() => {
        resetToWaitState();
      }, 1800);
    });

    socket.on('system-lock-status', (data) => {
      if (!data.isLocked && currentMode === 'member') {
        statusTag.innerText = "ロック解除";
        statusTag.className = "status-tag success";
        resultText.innerText = data.message || "システムロックを解除しました";

        autoResetTimer = setTimeout(() => {
          resetToWaitState();
        }, 1800);
      }
    });

    function resetToWaitState() {
      if (autoResetTimer) clearTimeout(autoResetTimer);
      candidateCount = 0;
      lastCandidateCode = "";
      statusTag.innerText = "読取待機中";
      statusTag.className = "status-tag";
      resultText.innerText = currentMode === 'member' 
        ? "読取機にQRコードをかざしてください" 
        : "読取機にバーコードをかざしてください";
      nextScanBtn.style.display = "none";
      isScanning = true;
    }

    window.addEventListener('load', () => {
      switchMode('member');
    });
  </script>
</body>
</html>
