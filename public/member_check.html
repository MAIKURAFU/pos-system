<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>読取機</title>
  <script src="/socket.io/socket.io.js"></script>
  <!-- 高速・確実なQR読み取りライブラリ jsQR -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, sans-serif; }
    body { margin: 0; padding: 0; background: #0f172a; color: #fff; text-align: center; overflow: hidden; }
    
    .container { display: flex; flex-direction: column; height: 100vh; justify-content: space-between; padding: 15px; }
    
    /* タブ切り替えUI */
    .tab-container {
      display: flex;
      background: #1e293b;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 10px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #38bdf8;
      color: #0f172a;
    }

    .scanner-container {
      position: relative;
      width: 100%;
      max-width: 360px;
      height: 280px;
      margin: 0 auto;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      border: 2px solid #334155;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    /* スキャンガイド（モードに応じて縦横比変更） */
    .scan-guide {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 200px; height: 200px;
      border: 3px solid #38bdf8;
      border-radius: 12px;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      transition: all 0.3s ease;
    }
    /* 在庫補充時の横長ガイド */
    .scan-guide.barcode-mode {
      width: 260px;
      height: 120px;
    }

    .restock-controls {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .restock-controls label { font-size: 14px; color: #94a3b8; }
    .restock-controls input {
      width: 80px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      text-align: center;
    }

    .result-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 15px;
      margin-top: 10px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .status-tag {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      background: #334155;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .status-tag.active { background: #0284c7; color: #fff; }
    .status-tag.success { background: #10b981; color: #fff; }
    .status-tag.checkout { background: #f59e0b; color: #fff; }
    .status-tag.error { background: #ef4444; color: #fff; }

    .result-text { font-size: 15px; font-weight: bold; margin: 6px 0; word-break: break-all; }
    
    .reset-btn {
      margin-top: 6px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .reset-btn:active { background: #0369a1; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <!-- タブ切り替えボタン -->
      <div class="tab-container">
        <button id="tabMember" class="tab-btn active" onclick="switchMode('member')">会員スキャン (QR)</button>
        <button id="tabRestock" class="tab-btn" onclick="switchMode('restock')">在庫補充 (JAN)</button>
      </div>
    </header>

    <div class="scanner-container">
      <video id="video" playsinline></video>
      <canvas id="canvas" hidden></canvas>
      <div id="scanGuide" class="scan-guide"></div>
    </div>

    <!-- 在庫補充用：一度に補充する個数の設定 -->
    <div id="restockInputArea" class="restock-controls" style="display: none;">
      <label for="restockAmount">補充数量:</label>
      <input type="number" id="restockAmount" value="1" min="1" max="999">
    </div>

    <div class="result-card">
      <div id="statusTag" class="status-tag">読み取り待機中</div>
      <div id="resultText" class="result-text">カメラにコードをかざしてください</div>
      <button id="nextScanBtn" class="reset-btn" style="display:none;" onclick="resetToWaitState()">次のコードを読み取る</button>
    </div>
  </div>

  <script>
    const socket = io();
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusTag = document.getElementById('statusTag');
    const resultText = document.getElementById('resultText');
    const nextScanBtn = document.getElementById('nextScanBtn');
    const restockInputArea = document.getElementById('restockInputArea');
    const scanGuide = document.getElementById('scanGuide');

    let isScanning = true;
    let currentMode = 'member'; // 'member' または 'restock'
    let lastScannedCode = null;
    let autoResetTimer = null;

    // --- 各会員の入退場状態を保持するマップ (key: 会員コード, value: 'entered' | 'exited') ---
    const memberStateMap = new Map();

    // --- 会員QRコードの形式検証関数 ---
    function isValidMemberQR(qrStr) {
      if (!qrStr || typeof qrStr !== 'string') return false;
      return qrStr.trim().length > 0;
    }

    // JANコードのチェックデジット検証 (モジュラス10)
    function isValidJanCheckDigit(janStr) {
      if (!/^\d{8}$|^\d{13}$/.test(janStr)) return false;
      const digits = janStr.split('').map(Number);
      const checkDigit = digits.pop();
      let sum = 0;

      if (janStr.length === 13) {
        for (let i = 0; i < digits.length; i++) {
          sum += (i % 2 === 1) ? digits[i] * 3 : digits[i];
        }
      } else {
        for (let i = 0; i < digits.length; i++) {
          sum += (i % 2 === 0) ? digits[i] * 3 : digits[i];
        }
      }

      const calculatedCheckDigit = (10 - (sum % 10)) % 10;
      return calculatedCheckDigit === checkDigit;
    }

    // Web Audio API によるスキャン音の再生（iOS対応）
    let audioCtx = null;
    function initAudio() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        console.error("Audio init error", e);
      }
    }

    function playBeepSound(type = 'success') {
      try {
        initAudio();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sine';
        
        if (type === 'success') {
          osc.frequency.setValueAtTime(1800, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.1);
        } else {
          // 補充時のピピッという2音
          osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.08);

          setTimeout(() => {
            if (!audioCtx) return;
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(1800, audioCtx.currentTime);
            gain2.gain.setValueAtTime(0.15, audioCtx.currentTime);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start();
            osc2.stop(audioCtx.currentTime + 0.1);
          }, 90);
        }
      } catch (e) {
        console.error("Audio play error", e);
      }

      if ("vibrate" in navigator) {
        navigator.vibrate(100);
      }
    }

    // 初回タッチ時にオーディオを初期化（iOS制限対策）
    document.addEventListener('touchstart', initAudio, { once: true });
    document.addEventListener('click', initAudio, { once: true });

    // モード切り替え処理
    function switchMode(mode) {
      if (currentMode === mode) return;
      currentMode = mode;
      
      document.getElementById('tabMember').classList.toggle('active', mode === 'member');
      document.getElementById('tabRestock').classList.toggle('active', mode === 'restock');
      
      restockInputArea.style.display = (mode === 'restock') ? 'flex' : 'none';
      
      if (mode === 'restock') {
        scanGuide.classList.add('barcode-mode');
      } else {
        scanGuide.classList.remove('barcode-mode');
      }

      resetToWaitState();
    }

    // 確実な背面カメラの起動処理
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } }
        });
        video.srcObject = stream;
        video.setAttribute('playsinline', true);
        video.play();
        requestAnimationFrame(tick);
      } catch (err) {
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" }
          });
          video.srcObject = fallbackStream;
          video.setAttribute('playsinline', true);
          video.play();
          requestAnimationFrame(tick);
        } catch (e) {
          statusTag.innerText = "エラー";
          statusTag.className = "status-tag error";
          resultText.innerText = "カメラの起動に失敗しました";
        }
      }
    }

    // フレーム毎のスキャン処理 (jsQRを使用)
    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: "dontInvert",
        });

        if (code && isScanning) {
          if (code.data !== lastScannedCode) {
            onCodeScanned(code.data);
          }
        }
      }
      requestAnimationFrame(tick);
    }

    function onCodeScanned(scannedData) {
      const trimmedData = scannedData.trim();

      // --- 会員モードの場合のQR形式チェック ---
      if (currentMode === 'member') {
        if (!isValidMemberQR(trimmedData)) return;
      }

      // 在庫補充（JAN）の場合のみチェックデジットを検証
      if (currentMode === 'restock') {
        if (!isValidJanCheckDigit(trimmedData)) return;
      }

      // 確定処理
      isScanning = false;
      lastScannedCode = scannedData;

      if (autoResetTimer) clearTimeout(autoResetTimer);

      statusTag.innerText = "処理中";
      statusTag.className = "status-tag active";

      if (currentMode === 'member') {
        // --- 入退場状態のトグル判定 (未入場/退場中なら入場、入場中なら退場) ---
        const currentState = memberStateMap.get(trimmedData) || 'exited';
        const isEntering = (currentState === 'exited');
        const actionType = isEntering ? 'check-in' : 'check-out';
        
        // 状態を反転して保存
        memberStateMap.set(trimmedData, isEntering ? 'entered' : 'exited');

        playBeepSound('success');
        resultText.innerText = `読み取りコード: ${trimmedData} (${isEntering ? '入場' : '退場'})`;
        
        // サーバーへ送信
        socket.emit('scan-qr', { 
          code: trimmedData,
          action: actionType
        });
      } else if (currentMode === 'restock') {
        playBeepSound('restock');
        const amountInput = document.getElementById('restockAmount');
        const amount = parseInt(amountInput.value, 10) || 1;
        
        socket.emit('restock-item', { 
          productId: trimmedData, 
          amount: amount 
        });
        
        statusTag.innerText = "補充完了";
        statusTag.className = "status-tag success";
        resultText.innerText = `JAN [${trimmedData}] を ${amount}個 補充しました`;

        autoResetTimer = setTimeout(() => {
          resetToWaitState();
        }, 1800);
      }

      nextScanBtn.style.display = "inline-block";
    }

    // サーバーからのエラー応答
    socket.on('error-message', (data) => {
      statusTag.innerText = "エラー";
      statusTag.className = "status-tag error";
      resultText.innerText = (data && data.message) ? data.message : "エラーが発生しました";
    });

    // 会員読み取り完了の通知
    socket.on('member-scanned', (data) => {
      statusTag.innerText = "読取完了";
      statusTag.className = "status-tag success";

      const memberObj = data ? (data.member || data) : {};
      const memberId = memberObj.id || memberObj.memberId || memberObj.code || '不明';

      resultText.innerText = `会員ID: ${memberId} を読み取りました`;

      autoResetTimer = setTimeout(() => {
        resetToWaitState();
      }, 1800);
    });

    // システムロック状態の受信（従業員QR読み取り時の通知）
    socket.on('system-lock-status', (data) => {
      if (!data.isLocked && currentMode === 'member') {
        statusTag.innerText = "ロック解除";
        statusTag.className = "status-tag success";
        resultText.innerText = data.message || "システムロックを解除しました";

        autoResetTimer = setTimeout(() => {
          resetToWaitState();
        }, 1800);
      }
    });

    // 待機状態に戻す
    function resetToWaitState() {
      if (autoResetTimer) clearTimeout(autoResetTimer);
      lastScannedCode = null;
      statusTag.innerText = "読取待機中";
      statusTag.className = "status-tag";
      resultText.innerText = currentMode === 'member' 
        ? "カメラにコードをかざしてください" 
        : "カメラにコードをかざしてください";
      nextScanBtn.style.display = "none";
      isScanning = true;
    }

    window.addEventListener('load', () => {
      switchMode('member');
      startCamera();
    });
  </script>
</body>
</html>
