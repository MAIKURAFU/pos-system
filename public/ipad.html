<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>総合管理システム</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, sans-serif; }
    body { margin: 0; padding: 15px; background: #f4f6f9; display: flex; gap: 15px; height: 100vh; }
    
    /* 左パネル */
    .left-panel { flex: 1; background: #fff; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; overflow-y: auto; }
    .status-card { background: #eef2ff; border: 2px solid #6366f1; border-radius: 10px; padding: 15px; text-align: center; margin-bottom: 15px; position: relative; }
    .status-card.active { cursor: pointer; transition: transform 0.1s, background 0.2s; }
    .status-card.active:active { transform: scale(0.98); background: #e0e7ff; }
    
    /* 選択解除ボタン */
    .clear-member-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10;
    }
    .clear-member-btn:hover { background: #dc2626; }

    .chip-badge { font-size: 32px; font-weight: bold; color: #4f46e5; margin: 5px 0; }
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
    .btn { padding: 12px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; background: #4f46e5; color: #fff; }
    .btn:disabled { background: #9ca3af; cursor: not-allowed; }
    
    /* 減額ボタン専用スタイル */
    .btn.btn-danger { background: #ef4444; }
    .btn.btn-danger:disabled { background: #9ca3af; cursor: not-allowed; }

    /* 履歴エリア */
    .history-section { border-top: 2px solid #e5e7eb; padding-top: 10px; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .history-list { flex: 1; overflow-y: auto; background: #fafafa; border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px; font-size: 13px; }
    .history-item { background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px; margin-bottom: 6px; }
    .history-time { color: #6b7280; font-size: 11px; margin-bottom: 2px; }
    
    /* 右パネル */
    .right-panel { flex: 2; background: #fff; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    
    /* カテゴリタブ */
    .category-tabs { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; }
    .tab-btn { padding: 8px 16px; border: 1px solid #d1d5db; border-radius: 20px; background: #f3f4f6; cursor: pointer; font-weight: bold; font-size: 14px; white-space: nowrap; }
    .tab-btn.active { background: #4f46e5; color: white; border-color: #4f46e5; }

    .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 15px; flex: 1; overflow-y: auto; }
    .product-card { border: 2px solid #e5e7eb; border-radius: 10px; padding: 12px; cursor: pointer; position: relative; background: #fafafa; display: flex; flex-direction: column; justify-content: space-between; }
    .product-card.active { border-color: #10b981; background: #ecfdf5; }
    .product-card.out-of-stock { opacity: 0.6; }
    .category-tag { font-size: 11px; font-weight: bold; color: #6b7280; background: #e5e7eb; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 4px; }
    .rate-badge { position: absolute; top: 10px; right: 10px; background: #ef4444; color: #fff; font-size: 12px; font-weight: bold; padding: 4px 8px; border-radius: 12px; }
    
    .edit-item-btn { margin-top: 6px; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer; color: #374151; font-weight: bold; width: fit-content; }
    .edit-item-btn:hover { background: #e5e7eb; }

    /* カートエリア */
    .cart-section { border-top: 2px solid #e5e7eb; padding-top: 15px; }
    .cart-list { max-height: 110px; overflow-y: auto; margin-bottom: 10px; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; background: #f3f4f6; padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; }
    .cart-controls { display: flex; align-items: center; gap: 8px; }
    .qty-btn { width: 28px; height: 28px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
    .btn-minus { background: #f59e0b; color: white; }
    .btn-plus { background: #10b981; color: white; }
    .btn-del { background: #ef4444; color: white; font-size: 12px; padding: 0 6px; height: 28px; }

    .restock-btn { background: #0b9f6e; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .manage-btn { background: #6366f1; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .checkout-btn { width: 100%; padding: 18px; font-size: 22px; font-weight: bold; background: #10b981; color: white; border: none; border-radius: 10px; cursor: pointer; }
    .checkout-btn:disabled { background: #9ca3af; cursor: not-allowed; }

    /* モーダル */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 999; }
    .modal { background: white; border-radius: 12px; padding: 25px; width: 400px; max-width: 90%; }
    .modal h3 { margin-top: 0; }
    .modal label { font-size: 12px; font-weight: bold; color: #4b5563; display: block; margin-top: 10px; text-align: left; }
    .modal input, .modal select { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }

    /* 総合管理ダッシュボード用モーダル拡張デザイン */
    .manage-modal { width: 750px; max-width: 95vw; height: 85vh; display: flex; flex-direction: column; }
    .manage-tabs { display: flex; gap: 6px; border-bottom: 2px solid #e5e7eb; padding-bottom: 8px; margin-bottom: 15px; }
    .manage-tab-btn { padding: 8px 14px; border: none; background: #f3f4f6; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; color: #4b5563; }
    .manage-tab-btn.active { background: #6366f1; color: white; }
    .manage-content { flex: 1; overflow-y: auto; padding-right: 4px; }
    .stat-card-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
    .stat-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; text-align: center; }
    .stat-value { font-size: 22px; font-weight: bold; color: #312e81; margin-top: 4px; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    .data-table th, .data-table td { border: 1px solid #e5e7eb; padding: 8px 10px; text-align: left; }
    .data-table th { background: #f9fafb; font-weight: bold; color: #374151; }
  </style>
</head>
<body>

  <!-- 左側：会員情報・チャージ／減額・購入履歴 -->
  <div class="left-panel">
    <div class="status-card" id="memberStatus">
      <h3 style="margin:0; color:#6b7280;">スキャン待機中</h3>
      <p style="margin:5px 0 0 0; font-size:14px; color:#9ca3af;">読取機でQRコードを読み取ってください</p>
    </div>
    
    <!-- チップ増減（チャージ／減額）エリア -->
    <h3 style="margin: 0 0 8px 0;">チップ管理</h3>
    <div class="btn-group">
      <input type="number" id="chipAmountInput" placeholder="枚数を入力 (例: 10, -5)" disabled style="grid-column: span 2; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; width: 100%;">
      <button class="btn charge-btn" id="applyChipBtn" onclick="submitCustomChip()" disabled style="grid-column: span 2;">確定</button>
    </div>

    <!-- 購入履歴エリア -->
    <div class="history-section">
      <h3 style="margin:0 0 8px 0;">購入履歴</h3>
      <div class="history-list" id="historyList">
        <div style="color:#9ca3af; text-align:center; margin-top:20px;">QEコードを読み取ると履歴が表示されます</div>
      </div>
    </div>
  </div>

  <!-- 右側：商品＆カート -->
  <div class="right-panel">
    <div class="header-row">
      <h2 style="margin:0;">商品一覧</h2>
      <div style="display:flex; gap:8px;">
        <button class="manage-btn" onclick="openManageModal()">📊 管理</button>
        <button class="restock-btn" onclick="openRestockModal()">📦 在庫追加</button>
        <button class="restock-btn" style="background:#ef4444;" onclick="requestLock()">🔒 システムロック</button>
      </div>
    </div>

    <!-- カテゴリ選択タブ -->
    <div class="category-tabs">
      <button class="tab-btn active" onclick="filterCategory('すべて')">すべて</button>
      <button class="tab-btn" onclick="filterCategory('菓子類')">菓子類</button>
      <button class="tab-btn" onclick="filterCategory('飲料')">飲料</button>
      <button class="tab-btn" onclick="filterCategory('その他')">その他</button>
      <button class="tab-btn" onclick="filterCategory('イベント')">イベント</button>
    </div>
    
    <div class="product-grid" id="productGrid"></div>

    <div class="cart-section">
      <h3 style="margin:0 0 8px 0; font-size:16px;">選択中の商品</h3>
      <div class="cart-list" id="cartList">
        <div style="color:#9ca3af; font-size:14px;">商品が選択されていません</div>
      </div>
      
      <div style="margin-bottom:10px; font-weight:bold; font-size:18px;">
        消費チップ合計: <span id="totalCost" style="color:#ef4444;">0</span> 枚
      </div>
      <button class="checkout-btn" id="checkoutBtn" onclick="submitPurchase()" disabled>交換確定</button>
    </div>
  </div>

  <!-- 総合管理モーダル -->
  <div class="modal-overlay" id="manageModal">
    <div class="modal manage-modal">
      <h3 style="margin-bottom: 10px;">総合管理システム</h3>
      <div class="manage-tabs">
        <button class="manage-tab-btn active" onclick="switchManageTab('sales')">販売状況</button>
        <button class="manage-tab-btn" onclick="switchManageTab('stock')">在庫一覧</button>
        <button class="manage-tab-btn" onclick="switchManageTab('members')">会員一覧</button>
        <button class="manage-tab-btn" onclick="switchManageTab('attendance')">入場状況</button>
      </div>
      <div class="manage-content" id="manageModalContent"></div>
      <div style="margin-top: 15px; text-align: right;">
        <button class="btn" style="background:#6b7280; padding: 8px 20px;" onclick="closeModal('manageModal')">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 在庫補充モーダル -->
  <div class="modal-overlay" id="restockModal">
    <div class="modal">
      <h3>在庫の追加</h3>
      <select id="restockProductSelect"></select>
      <input type="number" id="restockAmount" placeholder="追加数量 (例: 10)" min="1">
      <div style="display:flex; gap:10px; margin-top:15px;">
        <button class="btn" style="background:#6b7280; flex:1;" onclick="closeModal('restockModal')">キャンセル</button>
        <button class="btn" style="background:#10b981; flex:1;" onclick="submitRestock()">実行</button>
      </div>
    </div>
  </div>

  <!-- 商品情報編集モーダル（カテゴリ設定を追加） -->
  <div class="modal-overlay" id="editProductModal">
    <div class="modal">
      <h3>商品情報の編集</h3>
      <input type="hidden" id="editProductId">
      
      <label>景品名</label>
      <input type="text" id="editProductName">
      
      <label>ジャンル (カテゴリ)</label>
      <select id="editProductCategory">
        <option value="菓子類">菓子類</option>
        <option value="飲料">飲料</option>
        <option value="その他">その他</option>
        <option value="イベント">イベント</option>
      </select>
      
      <label>交換価格</label>
      <input type="number" id="editProductPrice" min="0">
      
      <label>在庫数</label>
      <input type="number" id="editProductStock" min="0">

      <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="btn" style="background:#6b7280; flex:1;" onclick="closeModal('editProductModal')">キャンセル</button>
        <button class="btn" style="background:#10b981; flex:1;" onclick="submitProductEdit()">変更を保存</button>
      </div>
    </div>
  </div>

  <!-- 会員詳細・購入履歴表示モーダル -->
  <div class="modal-overlay" id="memberHistoryModal">
    <div class="modal" style="width:500px;">
      <h3 id="modalMemberTitle" style="margin-bottom:5px;">詳細</h3>
      <div id="modalMemberSubtitle" style="color:#6b7280; font-size:14px; margin-bottom:15px;"></div>
      
      <h4 style="text-align:left; margin:10px 0 5px 0;">交換履歴</h4>
      <div id="modalHistoryList" style="max-height:300px; overflow-y:auto; border:1px solid #e5e7eb; border-radius:8px; padding:10px; background:#fafafa;"></div>

      <div style="margin-top:20px;">
        <button class="btn" style="background:#6b7280; width:100%;" onclick="closeModal('memberHistoryModal')">閉じる</button>
      </div>
    </div>
  </div>

  <!-- システムロック画面オーバーレイ -->
  <div class="modal-overlay" id="lockOverlay" style="z-index: 9999; background: rgba(15, 23, 42, 0.95); flex-direction: column; color: white; display: none;">
    <div style="text-align: center;">
      <div style="font-size: 64px; margin-bottom: 20px;">🔒</div>
      <h2 style="margin: 0 0 10px 0; font-size: 28px;">システムはロックされています</h2>
      <p style="color: #9ca3af; font-size: 16px; margin: 0;">読取機から従業員コードを読み取って解除してください</p>
    </div>
  </div>

  <script>
    const socket = io();
    let currentMember = null, productsList = [], cart = {}, selectedCategory = 'すべて';
    let allMembers = []; // 管理画面用の全会員データ保持用
    let currentManageTab = 'sales';

    socket.on('init-data', (data) => {
      productsList = data.products || [];
      renderProducts();
      if (data.isLocked) {
        showLockScreen(true);
      }
    });

    socket.on('member-scanned', (data) => { 
      if (data && data.member) {
        currentMember = data.member; 
        cart = {}; 
        renderMember(); 
        renderProducts(); 
      }
    });

    socket.on('member-updated', (data) => { 
      if (data && data.member) {
        currentMember = data.member; 
        renderMember(); 
        renderProducts();
      }
    });

    socket.on('data-updated', (data) => { 
      if (data.member !== undefined) currentMember = data.member; 
      if (data.products) productsList = data.products; 
      renderMember(); 
      renderProducts(); 
    });

    socket.on('system-lock-status', (data) => {
      showLockScreen(data.isLocked);
      if (data.isLocked) {
        clearMemberSilently();
      }
    });

    socket.on('purchase-success', (res) => { 
      alert(res.message); 
      clearMemberSilently(); 
    });

    socket.on('toast-message', (res) => alert(res.message));
    socket.on('error-message', (res) => alert(res.message));

    // --- 管理データ受信用のイベントリスナー ---
    socket.on('manage-data-response', (data) => {
      allMembers = data.members || [];
      document.getElementById('manageModal').style.display = 'flex';
      switchManageTab('sales');
    });

    function requestLock() {
      socket.emit('lock-system');
    }

    function showLockScreen(locked) {
      const overlay = document.getElementById('lockOverlay');
      if (overlay) {
        overlay.style.display = locked ? 'flex' : 'none';
      }
    }

    function clearMember() {
      if (Object.keys(cart).length > 0) {
        if (!confirm('カートに商品が入っています。選択を解除してカートをリセットしますか？')) {
          return;
        }
      }
      clearMemberSilently();
    }

    function clearMemberSilently() {
      currentMember = null;
      cart = {};
      renderMember();
      renderProducts();
    }

    function filterCategory(cat) {
      selectedCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.trim() === cat);
      });
      renderProducts();
    }

    function buildHistoryHTML(historyArray) {
      if (!historyArray || historyArray.length === 0) {
        return '<div style="color:#9ca3af; text-align:center; padding:10px;">交換履歴がありません</div>';
      }
      return historyArray.map(h => {
        const staffText = h.staffId ? ` | 担当: ${h.staffId}` : '';
        const itemName = h.items || h.item || h.name || '商品情報なし';
        const rawCost = h.cost !== undefined ? h.cost : (h.amount || h.price || 0);
        const itemTime = h.time || h.timestamp || '日時不明';

        const costVal = Number(rawCost);
        const displayCost = isNaN(costVal) ? rawCost : (costVal > 0 ? `-${costVal}` : `+${Math.abs(costVal)}`);

        return `
          <div class="history-item">
            <div class="history-time">⏰ ${itemTime}${staffText}</div>
            <div style="font-weight:bold; color:#111827;">${itemName}</div>
            <div style="color:#ef4444; font-weight:bold; text-align:right; margin-top:2px;">${displayCost} チップ</div>
          </div>
        `;
      }).join('');
    }

    function renderMember() {
      const statusDiv = document.getElementById('memberStatus');
      const hList = document.getElementById('historyList');
      const chipInput = document.getElementById('chipAmountInput');
      const applyBtn = document.getElementById('applyChipBtn');

      if (!currentMember) {
        statusDiv.className = 'status-card';
        statusDiv.removeAttribute('onclick');
        statusDiv.innerHTML = `
          <h3 style="margin:0; color:#6b7280;">スキャン待機中</h3>
          <p style="margin:5px 0 0 0; font-size:14px; color:#9ca3af;">iPhoneで会員QRコードを読み取ってください</p>`;
        
        hList.innerHTML = '<div style="color:#9ca3af; text-align:center; margin-top:20px;">会員コードを読み取ると履歴が表示されます</div>';
        if (chipInput) { chipInput.disabled = true; chipInput.value = ''; }
        if (applyBtn) applyBtn.disabled = true;
        return;
      }

      if (chipInput) chipInput.disabled = false;
      if (applyBtn) applyBtn.disabled = false;

      statusDiv.className = 'status-card active';
      statusDiv.setAttribute('onclick', 'openMemberHistoryModal()');

      const displayId = currentMember.id || currentMember.memberId || currentMember.code || '不明';
      const displayChips = currentMember.chips !== undefined ? currentMember.chips : 0;

      statusDiv.innerHTML = `
        <button class="clear-member-btn" onclick="event.stopPropagation(); clearMember();">✕ 選択解除</button>
        <h2 style="margin:0; text-decoration: underline;">ID: ${displayId}</h2>
        <div style="margin-top:5px; font-size:12px; color:#6366f1;">👆 タップで全履歴を表示</div>
        <div style="margin-top:5px; font-size:14px; color:#4b5563;">現在の所持チップ</div>
        <div class="chip-badge">${displayChips} 枚</div>`;

      hList.innerHTML = buildHistoryHTML(currentMember.history);
    }

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';

      let filtered = productsList;
      if (selectedCategory !== 'すべて') {
        filtered = filtered.filter(p => p.category === selectedCategory);
      }
      const sorted = [...filtered].sort((a, b) => (b.reductionRate || 0) - (a.reductionRate || 0));
      
      sorted.forEach(p => {
        const inCartQty = cart[p.id] || 0;
        const card = document.createElement('div');
        card.className = `product-card ${inCartQty > 0 ? 'active' : ''} ${p.currentStock <= 0 ? 'out-of-stock' : ''}`;
        const reduction = p.reductionRate !== undefined ? p.reductionRate : 0;
        
        card.innerHTML = `
          <div class="rate-badge">減少率 ${reduction}%</div>
          <div onclick="addCart('${p.id}')" style="cursor:pointer; flex:1;">
            <span class="category-tag">${p.category || '未設定'}</span>
            <div style="font-weight:bold; font-size:18px;">${p.name}</div>
            <div style="color:#4b5563; margin-top:4px;">必要: ${p.price} チップ | 在庫: ${p.currentStock}/${p.initialStock}</div>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:flex-end;">
            <button class="edit-item-btn" onclick="event.stopPropagation(); openEditModal('${p.id}')">編集</button>
            ${inCartQty > 0 ? `<div style="color:#10b981; font-weight:bold;">カート内: ${inCartQty} 個</div>` : ''}
          </div>
        `;
        grid.appendChild(card);
      });
      renderCartUI();
    }

    function addCart(id) {
      if (!currentMember) return alert('QRコードを読み取ってください');
      const p = productsList.find(item => item.id === id);
      if (!p) return;
      const currentQty = cart[id] || 0;
      if (currentQty + 1 > p.currentStock) {
        return alert('これ以上在庫がありません');
      }
      cart[id] = currentQty + 1;
      renderProducts();
    }

    function changeQty(id, delta) {
      if (!cart[id]) return;
      const p = productsList.find(item => item.id === id);
      const newQty = cart[id] + delta;
      
      if (delta > 0 && newQty > p.currentStock) {
        return alert('これ以上在庫がありません');
      }

      if (newQty <= 0) {
        delete cart[id];
      } else {
        cart[id] = newQty;
      }
      renderProducts();
    }

    function removeCartItem(id) {
      delete cart[id];
      renderProducts();
    }

    function renderCartUI() {
      const list = document.getElementById('cartList');
      list.innerHTML = '';
      let total = 0;
      const keys = Object.keys(cart);

      if (keys.length === 0) {
        list.innerHTML = '<div style="color:#9ca3af; font-size:14px;">商品が選択されていません</div>';
      } else {
        keys.forEach(id => {
          const p = productsList.find(prod => prod.id === id);
          if (p) {
            const qty = cart[id];
            total += p.price * qty;
            const itemDiv = document.createElement('div');
            itemDiv.className = 'cart-item';
            itemDiv.innerHTML = `
              <div><strong>${p.name}</strong> (${p.price}枚 × ${qty})</div>
              <div class="cart-controls">
                <button class="qty-btn btn-minus" onclick="changeQty('${id}', -1)">-</button>
                <span>${qty}</span>
                <button class="qty-btn btn-plus" onclick="changeQty('${id}', 1)">+</button>
                <button class="qty-btn btn-del" onclick="removeCartItem('${id}')">削除</button>
              </div>
            `;
            list.appendChild(itemDiv);
          }
        });
      }

      const displayChips = currentMember ? (currentMember.chips !== undefined ? currentMember.chips : 0) : 0;
      const checkoutBtn = document.getElementById('checkoutBtn');

      document.getElementById('totalCost').innerText = total;
      checkoutBtn.disabled = !currentMember || total === 0 || total > displayChips;
    }

    function chargeChips(amount) {
      if (!currentMember) return alert('QRコードを読み取ってください');

      const displayChips = currentMember.chips !== undefined ? currentMember.chips : 0;
      if (amount < 0 && (displayChips + amount) < 0) {
        return alert('所持チップ数より多く減らすことはできません');
      }

      const memberId = currentMember.id || currentMember.memberId || currentMember.code;
      socket.emit('charge-chips', { memberId, amount });
    }

    function submitCustomChip() {
      const input = document.getElementById('chipAmountInput');
      const val = parseInt(input.value, 10);

      if (isNaN(val) || val === 0) {
        return alert('正確な枚数を入力してください');
      }

      chargeChips(val);
      input.value = '';
    }

    function submitPurchase() {
      if (!currentMember) return;
      const displayChips = currentMember.chips !== undefined ? currentMember.chips : 0;
      
      let total = 0;
      Object.keys(cart).forEach(id => {
        const p = productsList.find(item => item.id === id);
        if (p) total += p.price * cart[id];
      });

      if (total > displayChips) {
        return alert('所持チップが不足しています');
      }

      const memberId = currentMember.id || currentMember.memberId || currentMember.code;
      const cartItems = Object.keys(cart).map(id => ({ id, quantity: cart[id] }));
      socket.emit('purchase-items', { memberId, cartItems });
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function openManageModal() {
      socket.emit('request-manage-data');
    }

    function switchManageTab(tabName) {
      currentManageTab = tabName;
      document.querySelectorAll('.manage-tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      const buttons = document.querySelectorAll('.manage-tab-btn');
      if (tabName === 'sales' && buttons[0]) buttons[0].classList.add('active');
      if (tabName === 'stock' && buttons[1]) buttons[1].classList.add('active');
      if (tabName === 'members' && buttons[2]) buttons[2].classList.add('active');
      if (tabName === 'attendance' && buttons[3]) buttons[3].classList.add('active');

      renderManageContent();
    }

    function renderManageContent() {
      const container = document.getElementById('manageModalContent');
      if (!container) return;
      container.innerHTML = '';

      if (currentManageTab === 'sales') {
        let salesMap = {};
        productsList.forEach(p => salesMap[p.name] = 0);

        allMembers.forEach(m => {
          if (m.history) {
            m.history.forEach(h => {
              if (h.items && h.items !== '入場' && h.items !== '退場' && !h.items.includes('増額') && !h.items.includes('減額')) {
                const parts = h.items.split(',');
                parts.forEach(part => {
                  const match = part.trim().match(/(.+?)\s*×\s*(\d+)/);
                  if (match) {
                    const name = match[1].trim();
                    const qty = parseInt(match[2], 10);
                    salesMap[name] = (salesMap[name] || 0) + qty;
                  }
                });
              }
            });
          }
        });

        const sortedSales = Object.entries(salesMap).sort((a, b) => b[1] - a[1]);
        const best = sortedSales.slice(0, 5);
        const worst = [...sortedSales].reverse().slice(0, 5);

        container.innerHTML = `
          <h4 style="margin:0 0 10px 0;">販売状況(昇順)</h4>
          <table class="data-table">
            <tr><th>順位</th><th>商品名</th><th>販売数</th></tr>
            ${best.map((item, idx) => `<tr><td>${idx + 1}位</td><td>${item[0]}</td><td>${item[1]} 個</td></tr>`).join('')}
          </table>

          <h4 style="margin:20px 0 10px 0;">販売状況(降順)</h4>
          <table class="data-table">
            <tr><th>順位</th><th>商品名</th><th>販売数</th></tr>
            ${worst.map((item, idx) => `<tr><td>${idx + 1}位</td><td>${item[0]}</td><td>${item[1]} 個</td></tr>`).join('')}
          </table>
        `;
      } else if (currentManageTab === 'stock') {
        container.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h4 style="margin:0;">在庫管理</h4>
            <div style="display:flex; gap:6px;">
              <button class="btn" style="padding:4px 10px; font-size:12px;" onclick="renderStockTable('asc')">▲ 在庫が少ない順</button>
              <button class="btn" style="padding:4px 10px; font-size:12px;" onclick="renderStockTable('desc')">▼ 在庫が多い順</button>
            </div>
          </div>
          <div id="stockTableContainer"></div>
        `;
        renderStockTable('asc');
      } else if (currentManageTab === 'members') {
        const memberRows = allMembers.map(m => {
          const visitCount = m.history ? m.history.filter(h => h.items === '入場').length : 0;
          return `
            <tr>
              <td>ID: ${m.id}</td>
              <td>${m.chips} 枚</td>
              <td>${visitCount} 回</td>
            </tr>
          `;
        }).join('');

        container.innerHTML = `
          <h4 style="margin:0 0 10px 0;">会員一覧 (${allMembers.length} 名)</h4>
          <table class="data-table">
            <tr><th>会員ID</th><th>所持チップ</th><th>来場回数</th></tr>
            ${memberRows || '<tr><td colspan="3" style="text-align:center; color:#9ca3af;">会員データがありません</td></tr>'}
          </table>
        `;
      } else if (currentManageTab === 'attendance') {
        let attendedMembers = [];
        allMembers.forEach(m => {
          if (m.history && m.history.length > 0) {
            const lastLog = m.history[0];
            const hasAttendedToday = m.history.some(h => h.items === '入場');
            if (hasAttendedToday) {
              attendedMembers.push({
                id: m.id,
                chips: m.chips,
                lastAction: lastLog.items,
                time: lastLog.time
              });
            }
          }
        });

        container.innerHTML = `
          <div class="stat-card-group">
            <div class="stat-card">
              <div style="font-size:12px; color:#6b7280;">総入場数</div>
              <div class="stat-value">${allMembers.length} 人</div>
            </div>
            <div class="stat-card">
              <div style="font-size:12px; color:#6b7280;">累計入場数</div>
              <div class="stat-value">${attendedMembers.length} 人</div>
            </div>
            <div class="stat-card">
              <div style="font-size:12px; color:#6b7280;">総所持チップ総額</div>
              <div class="stat-value">${allMembers.reduce((sum, m) => sum + (m.chips || 0), 0)} 枚</div>
            </div>
          </div>

          <h4 style="margin:15px 0 10px 0;">入場履歴のある会員リスト</h4>
          <table class="data-table">
            <tr><th>会員ID</th><th>現在チップ</th><th>現在の状況</th><th>時刻</th></tr>
            ${attendedMembers.map(am => `
              <tr>
                <td>ID: ${am.id}</td>
                <td>${am.chips} 枚</td>
                <td><span style="font-weight:bold; color:${am.lastAction === '入場' ? '#10b981' : '#374151'}">${am.lastAction}</span></td>
                <td>${am.time}</td>
              </tr>
            `).join('') || '<tr><td colspan="4" style="text-align:center; color:#9ca3af;">該当データがありません</td></tr>'}
          </table>
        `;
      }
    }

    function renderStockTable(order) {
      const sortedProducts = [...productsList].sort((a, b) => {
        return order === 'asc' ? a.currentStock - b.currentStock : b.currentStock - a.currentStock;
      });

      const stockContainer = document.getElementById('stockTableContainer');
      if (!stockContainer) return;

      stockContainer.innerHTML = `
        <table class="data-table">
          <tr><th>カテゴリ</th><th>商品名</th><th>必要チップ</th><th>現在在庫 / 初期在庫</th><th>減少率</th></tr>
          ${sortedProducts.map(p => `
            <tr>
              <td><span class="category-tag">${p.category || '未設定'}</span></td>
              <td><strong>${p.name}</strong></td>
              <td>${p.price} 枚</td>
              <td><span style="color:${p.currentStock <= 2 ? '#ef4444; font-weight:bold;' : ''}">${p.currentStock}</span> / ${p.initialStock}</td>
              <td>${p.reductionRate || 0}%</td>
            </tr>
          `).join('')}
        </table>
      `;
    }

    function openRestockModal() {
      const select = document.getElementById('restockProductSelect');
      select.innerHTML = '';
      productsList.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.innerText = `[${p.category || '未設定'}] ${p.name} (現在在庫: ${p.currentStock})`;
        select.appendChild(opt);
      });
      document.getElementById('restockModal').style.display = 'flex';
    }

    function submitRestock() {
      const productId = document.getElementById('restockProductSelect').value;
      const amount = parseInt(document.getElementById('restockAmount').value, 10);
      if (!amount || amount <= 0) return alert('正しい数量を入力してください');
      
      socket.emit('restock-item', { productId, amount });
      closeModal('restockModal');
      document.getElementById('restockAmount').value = '';
    }

    function openEditModal(productId) {
      const p = productsList.find(item => item.id === productId);
      if (!p) return;

      document.getElementById('editProductId').value = p.id;
      document.getElementById('editProductName').value = p.name;
      document.getElementById('editProductCategory').value = p.category || '菓子類';
      document.getElementById('editProductPrice').value = p.price;
      document.getElementById('editProductStock').value = p.currentStock;

      document.getElementById('editProductModal').style.display = 'flex';
    }

    function submitProductEdit() {
      const productId = document.getElementById('editProductId').value;
      const name = document.getElementById('editProductName').value.trim();
      const category = document.getElementById('editProductCategory').value;
      const price = parseInt(document.getElementById('editProductPrice').value, 10);
      const currentStock = parseInt(document.getElementById('editProductStock').value, 10);

      if (!name || isNaN(price) || isNaN(currentStock)) {
        return alert('正しい値を入力してください');
      }

      socket.emit('update-product', { productId, name, category, price, currentStock });
      closeModal('editProductModal');
    }

    function openMemberHistoryModal() {
      if (!currentMember) return;

      const displayId = currentMember.id || currentMember.memberId || currentMember.code || '不明';
      const displayChips = currentMember.chips !== undefined ? currentMember.chips : 0;

      document.getElementById('modalMemberTitle').innerText = `会員 ID: ${displayId} の購入履歴`;
      document.getElementById('modalMemberSubtitle').innerText = `会員ID: ${displayId} | 所持チップ: ${displayChips}枚`;

      const listDiv = document.getElementById('modalHistoryList');
      listDiv.innerHTML = buildHistoryHTML(currentMember.history);

      document.getElementById('memberHistoryModal').style.display = 'flex';
    }
  </script>
</body>
</html>
