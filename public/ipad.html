<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>レジ画面（iPad）</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: sans-serif; display: flex; margin: 0; height: 100vh; }
    .left-panel, .right-panel { padding: 20px; box-sizing: border-box; }
    .left-panel { width: 60%; background-color: #f4f4f4; overflow-y: auto; }
    .right-panel { width: 40%; background-color: #fff; border-left: 1px solid #ccc; }
    .product-list { display: flex; flex-wrap: wrap; gap: 10px; }
    .product-card { 
      background: white; border: 1px solid #ddd; padding: 10px; border-radius: 5px; 
      width: calc(33% - 10px); cursor: pointer; text-align: center;
    }
    .product-card:active { background: #eee; }
    .member-info { margin-bottom: 20px; padding: 15px; background: #e3f2fd; border-radius: 8px; }
    .cart-list { border-top: 1px solid #eee; padding-top: 10px; margin-top: 10px; }
    .cart-item { display: flex; justify-content: space-between; margin-bottom: 5px; }
    button { padding: 10px; cursor: pointer; border: none; border-radius: 5px; background: #007bff; color: white; width: 100%; font-size: 16px; margin-top: 10px;}
    button:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- 左パネル：商品リスト -->
  <div class="left-panel">
    <h2>商品一覧</h2>
    <div id="product-container" class="product-list">
      <!-- サーバーから取得した商品がここに表示されます -->
    </div>
  </div>

  <!-- 右パネル：会員情報とカート -->
  <div class="right-panel">
    <div id="member-section" class="member-info" style="display: none;">
      <h2>会員情報</h2>
      <p>名前: <span id="member-name"></span> (ID: <span id="member-id"></span>)</p>
      <p>所持チップ: <strong id="member-chips"></strong> 枚</p>
    </div>
    <div id="waiting-message">
      <h2>iPhoneで会員のQRコードをスキャンしてください</h2>
    </div>

    <div class="cart-section">
      <h3>カート</h3>
      <div id="cart-items" class="cart-list">
        <!-- カートの中身がここに表示されます -->
      </div>
      <h3 style="text-align: right;">合計: <span id="total-cost">0</span> チップ</h3>
      <button id="checkout-btn" disabled>購入する</button>
    </div>
  </div>

  <script>
    const socket = io();
    let currentMember = null;
    let products = [];
    let cart = {};

    const productContainer = document.getElementById('product-container');
    const memberSection = document.getElementById('member-section');
    const waitingMessage = document.getElementById('waiting-message');
    const cartItemsDiv = document.getElementById('cart-items');
    const totalCostSpan = document.getElementById('total-cost');
    const checkoutBtn = document.getElementById('checkout-btn');

    // 初期データの受信（商品リスト）
    socket.on('init-data', (data) => {
      products = data.products;
      renderProducts();
    });

    // データの更新（購入後や設定変更後）
    socket.on('data-updated', (data) => {
      products = data.products;
      if (data.member && currentMember && data.member.id === currentMember.id) {
        currentMember = data.member;
        renderMember();
      }
      renderProducts();
    });

    // ★重要: スキャン情報の受信 (サーバーの構造 { member: { ... } } に合わせる)
    socket.on('member-scanned', (data) => {
      console.log('スキャン情報を受信:', data);
      if (data && data.member) {
        currentMember = data.member;
        cart = {}; // スキャンごとにカートをリセット
        renderMember();
        renderCart();
      }
    });

    // 購入完了
    socket.on('purchase-success', (data) => {
      alert(data.message);
      currentMember = null;
      cart = {};
      renderMember();
      renderCart();
    });

    // エラー
    socket.on('error-message', (data) => {
      alert('エラー: ' + data.message);
    });

    // 商品一覧の描画
    function renderProducts() {
      productContainer.innerHTML = '';
      products.forEach(p => {
        const div = document.createElement('div');
        div.className = 'product-card';
        div.innerHTML = `
          <strong>${p.name}</strong><br>
          ${p.price} チップ<br>
          在庫: ${p.currentStock}
        `;
        // 在庫がある場合のみクリック可能にする
        if (p.currentStock > 0) {
          div.onclick = () => addToCart(p);
        } else {
          div.style.background = '#f8d7da';
          div.style.cursor = 'not-allowed';
        }
        productContainer.appendChild(div);
      });
    }

    // 会員情報の描画
    function renderMember() {
      if (currentMember) {
        document.getElementById('member-name').innerText = currentMember.name;
        document.getElementById('member-id').innerText = currentMember.id;
        document.getElementById('member-chips').innerText = currentMember.chips;
        memberSection.style.display = 'block';
        waitingMessage.style.display = 'none';
        checkoutBtn.disabled = false;
      } else {
        memberSection.style.display = 'none';
        waitingMessage.style.display = 'block';
        checkoutBtn.disabled = true;
      }
    }

    // カートに追加
    function addToCart(product) {
      if (!currentMember) {
        alert('先に会員をスキャンしてください。');
        return;
      }
      
      const currentQuantity = cart[product.id] ? cart[product.id].quantity : 0;
      if (currentQuantity + 1 > product.currentStock) {
        alert('在庫が不足しています。');
        return;
      }

      if (cart[product.id]) {
        cart[product.id].quantity += 1;
      } else {
        cart[product.id] = { ...product, quantity: 1 };
      }
      renderCart();
    }

    // カートの描画
    function renderCart() {
      cartItemsDiv.innerHTML = '';
      let total = 0;
      Object.values(cart).forEach(item => {
        total += item.price * item.quantity;
        const div = document.createElement('div');
        div.className = 'cart-item';
        div.innerHTML = `<span>${item.name} (x${item.quantity})</span><span>${item.price * item.quantity} チップ</span>`;
        cartItemsDiv.appendChild(div);
      });
      totalCostSpan.innerText = total;

      // チップ不足チェック
      if (currentMember && total > currentMember.chips) {
        totalCostSpan.style.color = 'red';
        checkoutBtn.disabled = true;
      } else if (currentMember && total > 0) {
        totalCostSpan.style.color = 'black';
        checkoutBtn.disabled = false;
      } else {
        totalCostSpan.style.color = 'black';
        checkoutBtn.disabled = true;
      }
    }

    // 購入ボタンの処理
    checkoutBtn.onclick = () => {
      const cartItems = Object.values(cart).map(item => ({ id: item.id, quantity: item.quantity }));
      if (cartItems.length === 0) return;

      socket.emit('purchase-items', {
        memberId: currentMember.id,
        cartItems: cartItems
      });
    };
  </script>
</body>
</html>
