<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPad レジ & チップ管理</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, sans-serif; }
    body { margin: 0; padding: 15px; background: #f4f6f9; display: flex; gap: 15px; height: 100vh; }
    .left-panel { flex: 1; background: #fff; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; }
    .status-card { background: #eef2ff; border: 2px solid #6366f1; border-radius: 10px; padding: 15px; text-align: center; margin-bottom: 20px; }
    .chip-badge { font-size: 32px; font-weight: bold; color: #4f46e5; margin: 10px 0; }
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .btn { padding: 15px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; background: #4f46e5; color: #fff; }
    .right-panel { flex: 2; background: #fff; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; }
    .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; flex: 1; overflow-y: auto; }
    .product-card { border: 2px solid #e5e7eb; border-radius: 10px; padding: 15px; cursor: pointer; position: relative; background: #fafafa; }
    .product-card.active { border-color: #10b981; background: #ecfdf5; }
    .product-card.out-of-stock { opacity: 0.5; pointer-events: none; }
    .rate-badge { position: absolute; top: 10px; right: 10px; background: #ef4444; color: #fff; font-size: 12px; font-weight: bold; padding: 4px 8px; border-radius: 12px; }
    .cart-section { border-top: 2px solid #e5e7eb; padding-top: 15px; }
    .checkout-btn { width: 100%; padding: 20px; font-size: 22px; font-weight: bold; background: #10b981; color: white; border: none; border-radius: 10px; cursor: pointer; }
    .checkout-btn:disabled { background: #9ca3af; }
  </style>
</head>
<body>
  <div class="left-panel">
    <div class="status-card" id="memberStatus">
      <h3 style="margin:0; color:#6b7280;">スキャン待機中</h3>
      <p style="margin:5px 0 0 0; font-size:14px; color:#9ca3af;">iPhoneで会員QRコードを読み取ってください</p>
    </div>
    <h3>チップチャージ</h3>
    <div class="btn-group">
      <button class="btn" onclick="chargeChips(10)">+ 10 枚</button>
      <button class="btn" onclick="chargeChips(50)">+ 50 枚</button>
      <button class="btn" onclick="chargeChips(100)">+ 100 枚</button>
      <button class="btn" onclick="chargeChips(500)">+ 500 枚</button>
    </div>
  </div>
  <div class="right-panel">
    <h2>商品一覧（減少率順）</h2>
    <div class="product-grid" id="productGrid"></div>
    <div class="cart-section">
      <div style="margin-bottom:10px; font-weight:bold; font-size:18px;">
        消費チップ合計: <span id="totalCost" style="color:#ef4444;">0</span> 枚
      </div>
      <button class="checkout-btn" id="checkoutBtn" onclick="submitPurchase()" disabled>取引を確定する</button>
    </div>
  </div>

  <script>
    const socket = io();
    let currentMember = null, productsList = [], cart = {};

    socket.on('init-data', (data) => { productsList = data.products; renderProducts(); });
    socket.on('member-scanned', (data) => { currentMember = data.member; cart = {}; renderMember(); renderProducts(); });
    socket.on('member-updated', (data) => { currentMember = data.member; renderMember(); });
    socket.on('data-updated', (data) => { currentMember = data.member; productsList = data.products; cart = {}; renderMember(); renderProducts(); });
    socket.on('purchase-success', (res) => alert(res.message));
    socket.on('error-message', (res) => alert(res.message));

    function renderMember() {
      if (!currentMember) return;
      document.getElementById('memberStatus').innerHTML = `
        <h2>${currentMember.name} (ID: ${currentMember.id})</h2>
        <div>現在の所持チップ</div><div class="chip-badge">${currentMember.chips} 枚</div>`;
    }

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';
      const sorted = [...productsList].sort((a, b) => b.reductionRate - a.reductionRate);
      sorted.forEach(p => {
        const isSelected = cart[p.id] > 0;
        const card = document.createElement('div');
        card.className = `product-card ${isSelected ? 'active' : ''} ${p.currentStock <= 0 ? 'out-of-stock' : ''}`;
        card.onclick = () => toggleCart(p.id);
        card.innerHTML = `
          <div class="rate-badge">減少率 ${p.reductionRate}%</div>
          <div style="font-weight:bold; font-size:18px;">${p.name}</div>
          <div>必要: ${p.price} チップ | 在庫: ${p.currentStock}/${p.initialStock}</div>`;
        grid.appendChild(card);
      });
      updateCartTotal();
    }

    function toggleCart(id) {
      if (!currentMember) return alert('会員QRコードを読み取ってください');
      cart[id] = (cart[id] || 0) + 1;
      renderProducts();
    }

    function updateCartTotal() {
      let total = 0;
      Object.keys(cart).forEach(id => {
        const p = productsList.find(prod => prod.id === id);
        if (p) total += p.price * cart[id];
      });
      document.getElementById('totalCost').innerText = total;
      document.getElementById('checkoutBtn').disabled = !currentMember || total === 0;
    }

    function chargeChips(amount) {
      if (!currentMember) return alert('会員QRコードを読み取ってください');
      socket.emit('charge-chips', { memberId: currentMember.id, amount });
    }

    function submitPurchase() {
      if (!currentMember) return;
      const cartItems = Object.keys(cart).map(id => ({ id, quantity: cart[id] }));
      socket.emit('purchase-items', { memberId: currentMember.id, cartItems });
    }
  </script>
</body>
</html>
